name: Update build-apk.yml

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get Date
        id: get-date
        run: |
          echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: .buildozer_global
          key: buildozer-global-${{ runner.os }}-${{ steps.get-date.outputs.date }}-${{ hashFiles('buildozer.spec') }}

      - name: Build with Buildozer Action
        uses: ArtemSanya/buildozer-action@v1
        with:
          command: buildozer android debug
          repository_root: .
          workdir: .

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install Cython==0.29.33 buildozer wheel

      - name: Automate Build and Override NDK Warnings
        run: |
          # Inject NDK flag to prevent simple code warnings from stopping compilation
          export CFLAGS="-Wno-error=implicit-function-declaration"
          yes | buildozer -v android debug
        timeout-minutes: 40

      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
