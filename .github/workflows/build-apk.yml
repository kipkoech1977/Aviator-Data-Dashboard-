name: Legitimate Automated Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # Step 1: Securely pull code using official GitHub action
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up official Python runtime
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Step 3: Install verified build tools & dependencies
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ccache \
            git \
            libffi-dev \
            libssl-dev \
            libgstreamer1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            libsqlite3-dev \
            sqlite3 \
            bzip2 \
            libbz2-dev \
            zlib1g-dev \
            openssl \
            libgpm2 \
            libncurses5-dev \
            libncursesw5-dev \
            unzip \
            zip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config

      # Step 4: Install official pip packages safely
      - name: Install Buildozer & Cython Compiler
        run: |
          python -m pip install --upgrade pip
          pip install Cython==0.29.33
          pip install buildozer

      # Step 5: Execute automated compilation & bypass interactive requests
      - name: Auto-Compile Android APK
        run: |
          # 'yes' pipes confirmation into buildozer to accept licenses automatically
          yes | buildozer android debug

      # Step 6: Publish the generated binary securely using official upload module
      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stable-debug-apk
          path: bin/*.apk
          name: package
          path: bin/*.apk
      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install Cython==0.29.33 buildozer wheel

      - name: Automate Build and Override NDK Warnings
        run: |
          # Inject NDK flag to prevent simple code warnings from stopping compilation
          export CFLAGS="-Wno-error=implicit-function-declaration"
          yes | buildozer -v android debug
        timeout-minutes: 40

      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
