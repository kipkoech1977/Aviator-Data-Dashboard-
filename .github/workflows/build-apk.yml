- name: Install system packages
  run: |
    sudo apt-get update
    sudo apt-get install -y \
      autoconf \
      automake \
      libtool \
      libltdl-dev \
      pkg-config \
      m4 \
      git \
      zip \
      unzip \
      openjdk-17-jdk \
      python3-pip \
      zlib1g-dev \
      libffi-dev \
      libssl-dev            libffi-dev \
            libssl-dev \
            libsqlite3-dev \
            sqlite3 \
            bzip2 \
            libbz2-dev \
            zlib1g-dev \
            openssl \
            libgdbm-dev \
            libncursesw5-dev \
            libncurses5-dev \
            xz-utils \
            tk-dev \
            libxml2-dev \
            libxmlsec1-dev \
            uuid-dev \
            libreadline-dev \
            openjdk-17-jdk

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install Cython==0.29.33 buildozer wheel

      - name: Automate Build and Override NDK Warnings
        run: |
          # Inject NDK flag to prevent simple code warnings from stopping compilation
          export CFLAGS="-Wno-error=implicit-function-declaration"
          yes | buildozer -v android debug
        timeout-minutes: 40

      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
