name: Build Kivy APK without Buildozer

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK Environment
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Fix System Repositories and System Locks
      run: |
        sudo rm -rf /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock /var/cache/apt/archives/lock
        sudo sed -i 's/http:\/\/://ubuntu.com:\/\/://ubuntu.com' /etc/apt/sources.list
        sudo apt-get clean
        sudo apt-get update --fix-missing || true

    - name: Install System Build Prerequisites
      run: |
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          build-essential git zip unzip autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libssl-dev libgstreamer1.0-dev cmake gettext libffi-dev gperf \
          gfortran libblas-dev liblapack-dev

    - name: Download and Install Android SDK & NDK
      run: |
        mkdir -p $HOME/Android/Sdk/cmdline-tools
        curl -o cmdline-tools.zip https://google.com
        mkdir -p tmp_cmdline
        unzip -q cmdline-tools.zip -d tmp_cmdline
        mv tmp_cmdline/cmdline-tools $HOME/Android/Sdk/cmdline-tools/latest
        rm -rf tmp_cmdline cmdline-tools.zip
        
        yes | $HOME/Android/Sdk/cmdline-tools/latest/bin/sdkmanager --licenses
        $HOME/Android/Sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;25.2.9519653"

    - name: Install python-for-android Tools
      run: |
        pip install --upgrade pip
        pip install cython "python-for-android>=2024.1.1"

    - name: Compile Kivy App with Data Science Recipes
      run: |
        export ANDROIDSDK="$HOME/Android/Sdk"
        export ANDROIDNDK="$HOME/Android/Sdk/ndk/25.2.9519653"
        export PATH="$ANDROIDSDK/platform-tools:$HOME/.local/bin:$PATH"
        
        # Optimize compiler memory to keep pandas/numpy from crashing the runner
        export CFLAGS="-O1"
        export CXXFLAGS="-O1"
        
        p4a apk \
          --sdk-dir="$ANDROIDSDK" \
          --ndk-dir="$ANDROIDNDK" \
          --android-api=33 \
          --ndk-version=25.2.9519653 \
          --private . \
          --package=org.example.kivyapp \
          --name="Aviator Predictor" \
          --version=2.5.7 \
          --bootstrap=sdl2 \
          --requirements=python3,kivy,numpy,matplotlib,requests,pandas,python-dateutil,beautifulsoup4,lxml \
          --arch=arm64-v8a

    - name: Export and Save APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Aviator-Predictor-APK
        path: ./*.apk

    - name: Install System Build Prerequisites
      run: |
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          build-essential git zip unzip autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libssl-dev libgstreamer1.0-dev cmake gettext libffi-dev gperf

    - name: Download and Install Android SDK & NDK
      run: |
        mkdir -p $HOME/Android/Sdk/cmdline-tools
        curl -o cmdline-tools.zip https://google.com
        mkdir -p tmp_cmdline
        unzip -q cmdline-tools.zip -d tmp_cmdline
        mv tmp_cmdline/cmdline-tools $HOME/Android/Sdk/cmdline-tools/latest
        rm -rf tmp_cmdline cmdline-tools.zip
        
        # Automatically accept licenses and install required toolchains
        yes | $HOME/Android/Sdk/cmdline-tools/latest/bin/sdkmanager --licenses
        $HOME/Android/Sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;25.2.9519653"

    - name: Install python-for-android Tools
      run: |
        pip install --upgrade pip
        pip install cython python-for-android

    - name: Compile Kivy App with Dependencies to APK
      run: |
        export ANDROIDSDK="$HOME/Android/Sdk"
        export ANDROIDNDK="$HOME/Android/Sdk/ndk/25.2.9519653"
        export PATH="$ANDROIDSDK/platform-tools:$HOME/.local/bin:$PATH"
        
        # Dynamically read libraries from requirements.txt to pass into p4a
        EXTRA_REQS=""
        if [ -f "requirements.txt" ]; then
          # Read requirements, ignore comments/empty lines, convert to comma-separated
          EXTRA_REQS=$(grep -v '^#' requirements.txt | grep -v '^$' | tr '\n' ',' | sed 's/,$//')
          if [ ! -z "$EXTRA_REQS" ]; then
            EXTRA_REQS=",$EXTRA_REQS"
          fi
        fi
        
        echo "Detected dependencies to build: python3,kivy${EXTRA_REQS}"
        
        p4a apk \
          --sdk-dir="$ANDROIDSDK" \
          --ndk-dir="$ANDROIDNDK" \
          --android-api=33 \
          --ndk-version=25.2.9519653 \
          --private . \
          --package=org.example.kivyapp \
          --name="Aviator Predictor" \
          --version=2.5.7 \
          --bootstrap=sdl2 \
          --requirements="python3,kivy${EXTRA_REQS}" \
          --arch=arm64-v8a

    - name: Export and Save APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Aviator-Predictor-APK
        path: ./*.apk
        sudo apt-get update --fix-missing || true

    - name: Install System Build Prerequisites
      run: |
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          build-essential git zip unzip autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libssl-dev libgstreamer1.0-dev cmake gettext libffi-dev gperf

    - name: Download and Install Android SDK & NDK
      run: |
        mkdir -p $HOME/Android/Sdk/cmdline-tools
        curl -o cmdline-tools.zip https://google.com
        mkdir -p tmp_cmdline
        unzip -q cmdline-tools.zip -d tmp_cmdline
        mv tmp_cmdline/cmdline-tools $HOME/Android/Sdk/cmdline-tools/latest
        rm -rf tmp_cmdline cmdline-tools.zip
        
        # Automatically accept licenses and install required toolchains
        yes | $HOME/Android/Sdk/cmdline-tools/latest/bin/sdkmanager --licenses
        $HOME/Android/Sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;25.2.9519653"

    - name: Install python-for-android Tools
      run: |
        pip install --upgrade pip
        pip install cython python-for-android

    - name: Compile Kivy App to APK
      run: |
        export ANDROIDSDK="$HOME/Android/Sdk"
        export ANDROIDNDK="$HOME/Android/Sdk/ndk/25.2.9519653"
        export PATH="$ANDROIDSDK/platform-tools:$HOME/.local/bin:$PATH"
        
        p4a apk \
          --sdk-dir="$ANDROIDSDK" \
          --ndk-dir="$ANDROIDNDK" \
          --android-api=33 \
          --ndk-version=25.2.9519653 \
          --private . \
          --package=org.example.kivyapp \
          --name="My Kivy App" \
          --version=1.0 \
          --bootstrap=sdl2 \
          --requirements=python3,kivy \
          --arch=arm64-v8a

    - name: Export and Save APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kivy-Android-APK
        path: ./*.apk
