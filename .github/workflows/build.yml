name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Clean Buildozer Cache
      run: |
        rm -rf ~/.buildozer/android/platform/
        mkdir -p ~/.buildozer/android/platform/

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ccache libncurses5:i386 libstdc++6:i386 libgtk2.0-0:i386 libpangox-1.0-0:i386 libpangoxft-1.0-0:i386 libidn11:i386 zip unzip

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android SDK Licenses
      run: |
        mkdir -p $HOME/.android
        touch $HOME/.android/repositories.cfg
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Build Android Debug APK
      uses: ArtemSaves/buildozer-action@v1
      with:
        command: buildozer android debug
        repository_root: .

    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package-debug-apk
        path: bin/*.apk
