name: Build Kivy APK with Buildozer

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libssl-dev libgstreamer1.0-dev cmake gettext libffi-dev gperf \
          gfortran libblas-dev liblapack-dev

    - name: Install Buildozer and Toolchains
      run: |
        pip install --upgrade pip
        pip install buildozer cython

    - name: Configure Buildozer Specifications
      run: |
        if [ ! -f buildozer.spec ]; then
          buildozer init
          # Automatically inject your exact data library requirements into the spec
          sed -i 's/requirements = python3,kivy/requirements = python3,kivy,numpy,matplotlib,requests,pandas,python-dateutil,beautifulsoup4,lxml/' buildozer.spec
          sed -i 's/#android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
        fi

    - name: Compile Application with Buildozer
      run: |
        buildozer android debug

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: Aviator-Predictor-APK
        path: .bin/*.apk
