name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows you to manually trigger the build from the UI

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Configure System Compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache git libffi-dev libssl-dev autoconf automake libtool pkg-config zlib1g-dev android-tools-adb adb lld

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Compiling Requirements
        run: |
          pip install --upgrade pip
          pip install wheel setuptools cython==0.29.36

      - name: Build with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer android debug
          # Wipes out stale pipeline fragments automatically
          repository_cache: true

      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Standalone-Simulator-APK
          path: bin/*.apk
