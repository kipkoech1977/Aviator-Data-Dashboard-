name: Build Android APK with Buildozer

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Compile Kivy Application
    runs-on: ubuntu-22.04

    steps:
      # Step 1: Download code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Configure System Java (Required for Android SDK tools)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 3: Install underlying Ubuntu compile libraries 
      - name: Install System Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ccache \
            git \
            libffi-dev \
            libssl-dev \
            python3 \
            python3-pip \
            python3-setuptools \
            python3-virtualenv \
            unzip \
            zip

      # Step 4: Configure caching to optimize speed
      - name: Cache Buildozer Directories
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      # Step 5: Install Python tools and build APK natively without Docker
      - name: Run Native Buildozer Build
        run: |
          pip3 install --upgrade pip
          pip3 install --upgrade Cython==0.29.33 virtualenv buildozer
          buildozer android debug

      # Step 6: Find and output the final APK file
      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AviatorPredictor-Debug-APK
          path: bin/*.apk
