name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      # Installs all required backend tools for Android API 34 compilation
      - name: Configure System Compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache git libffi-dev libssl-dev autoconf automake libtool pkg-config zlib1g-dev android-tools-adb adb lld

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Installs wheels, setup tools, and Cython needed by Buildozer to parse python source code
      - name: Install Compiling Requirements
        run: |
          pip install --upgrade pip
          pip install wheel setuptools cython==0.29.36

      - name: Build with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer android debug
          repository_cache: true

      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aviator-Predictor-APK
          path: bin/*.apk
