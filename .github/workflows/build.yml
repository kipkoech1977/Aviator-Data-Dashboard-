      - name: Fix Buildozer Spec File
        run: |
          python3 -c "
          import os
          spec_file = 'buildozer.spec'
          correct_header = '[buildozer]\n'
          if os.path.exists(spec_file):
              with open(spec_file, 'r') as f:
                  content = f.read()
              if '[buildozer]' not in content:
                  fixed_content = correct_header + content.lstrip()
                  with open(spec_file, 'w') as f:
                      f.write(fixed_content)
          else:
              import subprocess
              subprocess.run(['buildozer', 'init'])
          "

      - name: Build Android App
        run: buildozer android debug
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: bin/*.apk
