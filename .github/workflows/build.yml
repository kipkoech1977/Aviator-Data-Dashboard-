    - name: Install System Dependencies
      run: |
        sudo apt-get clean
        sudo apt-get update
        # Force aptitude to fix broken dependencies or install dependencies explicitly
        sudo apt-get install -y -f
        sudo apt-get install -y --fix-broken
        
        # Install dependencies, bypassing broken gstreamer references if necessary
        sudo apt-get install -y \
          build-essential \
          git \
          ffmpeg \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          libsqlite3-dev \
          sqlite3 \
          bzip2 \
          libbz2-dev \
          libssl-dev \
          openssl \
          libgdbm-dev \
          libgdbm-compat-dev \
          liblzma-dev \
          libreadline-dev \
          libncursesw5-dev \
          libffi-dev \
          uuid-dev \
          tar \
          unzip \
          zip \
          openjdk-17-jdk \
          autoconf \
          automake \
          libtool \
          pkg-config \
          ccache \
          clang
