name: CI

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Android Platform Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev libffi-dev libgomp1

    - name: Install Buildozer
      run: |
        pip install --upgrade pip
        pip install buildozer cython virtualenv

    - name: Generate and configure buildozer.spec
      run: |
        if [ ! -f buildozer.spec ]; then
          yes | buildozer init
        fi
        # Automatically update dependencies inside the spec file
        sed -i 's/^requirements = .*$/requirements = python3,kivy/' buildozer.spec
        
        # Accept android licenses automatically during compile time
        sed -i 's/^#android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec

    - name: Build Android APK
      run: |
        buildozer android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
        name: package
        path: bin/*.apk
