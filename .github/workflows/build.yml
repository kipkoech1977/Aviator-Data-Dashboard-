name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout the repository code
    - name: Checkout repository code
      uses: actions/checkout@v4

    # Step 2: Clear old broken Buildozer platform downloads to prevent caching issues
    - name: Clean Buildozer Cache
      run: |
        rm -rf ~/.buildozer/android/platform/
        mkdir -p ~/.buildozer/android/platform/

    # Step 3: Install necessary system dependencies for Python and Android building
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ccache libncurses5:i386 libstdc++6:i386 libgtk2.0-0:i386 libpangox-1.0-0:i386 libpangoxft-1.0-0:i386 libidn11:i386 zip unzip

    # Step 4: Setup a dedicated Python environment
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # Step 5: Setup Java Development Kit 17 (Required by modern Android SDK tools)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # Step 6: Setup a modern, standardized Android SDK instance on the runner
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # Step 7: Fix the exact error by automatically accepting all licenses globally
    - name: Accept Android SDK Licenses
      run: |
        mkdir -p $HOME/.android
        touch $HOME/.android/repositories.cfg
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    # Step 8: Execute Buildozer to build the Android debug APK
    - name: Build Android Debug APK
      uses: ArtemSaves/buildozer-action@v1
      with:
        command: buildozer android debug
        repository_root: .

    # Step 9: Save and upload the successfully compiled APK file
    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package-debug-apk
        path: bin/*.apk
