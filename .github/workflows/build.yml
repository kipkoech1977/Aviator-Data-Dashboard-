name: CI

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # Fix: This automatically answers the interactive prompt and targets requirements
    - name: Auto-generate and configure buildozer.spec
      run: |
        pip install buildozer
        yes | buildozer init
        
        # This replaces the default requirement to include kivy and python3
        sed -i 's/^requirements = .*$/requirements = python3,kivy/' buildozer.spec

    - name: Build with Buildozer
      uses: ArtemSBulgakov/buildozer-action@v1
      id: buildozer
      with:
        command: buildozer android debug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
