name: CI

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Android Platform Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev libffi-dev libgomp1

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install buildozer cython virtualenv

    - name: Generate and configure buildozer spec file
      run: |
        if [ ! -f buildozer.spec ]; then
          yes | buildozer init
        fi
        
        # Define specific framework configurations
        sed -i 's/^requirements = .*$/requirements = python3,kivy/' buildozer.spec
        sed -i 's/^#android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
        
        # FIX: Force buildozer to use compatible Android SDK build and command line tool versions
        sed -i 's/^#android.sdk = .*$/android.sdk = 33/' buildozer.spec
        sed -i 's/^#android.api = .*$/android.api = 33/' buildozer.spec
        sed -i 's/^#android.ndk = .*$/android.ndk = 25b/' buildozer.spec
        sed -i 's/^#android.build_tools_version = .*$/android.build_tools_version = 33.0.0/' buildozer.spec

    - name: Build Android Debug APK
      run: |
        buildozer android debug

    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: Aviator-Predictor-APK
        path: .bin/*.apk
