name: Build Kivy APK without Buildozer

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK Environment
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configure Linux Package Installer
      run: |
        sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock
        sudo apt-get update --fix-missing

    - name: Install Linux Build Dependencies
      run: |
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          git zip unzip autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libssl-dev libgstreamer1.0-dev cmake gettext

    - name: Download and Install Android SDK & NDK
      run: |
        mkdir -p $HOME/Android/Sdk/cmdline-tools
        curl -o cmdline-tools.zip https://google.com
        mkdir -p tmp_cmdline
        unzip -q cmdline-tools.zip -d tmp_cmdline
        mv tmp_cmdline/cmdline-tools $HOME/Android/Sdk/cmdline-tools/latest
        rm -rf tmp_cmdline cmdline-tools.zip
        
        # Automatically accept licenses and install required toolchains
        yes | $HOME/Android/Sdk/cmdline-tools/latest/bin/sdkmanager --licenses
        $HOME/Android/Sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;25.2.9519653"

    - name: Install python-for-android Tools
      run: |
        pip install --upgrade pip
        pip install cython python-for-android

    - name: Compile Kivy App to APK
      run: |
        export ANDROIDSDK="$HOME/Android/Sdk"
        export ANDROIDNDK="$HOME/Android/Sdk/ndk/25.2.9519653"
        export PATH="$ANDROIDSDK/platform-tools:$HOME/.local/bin:$PATH"
        
        p4a apk \
          --sdk-dir="$ANDROIDSDK" \
          --ndk-dir="$ANDROIDNDK" \
          --android-api=33 \
          --ndk-version=25.2.9519653 \
          --private . \
          --package=org.example.kivyapp \
          --name="My Kivy App" \
          --version=1.0 \
          --bootstrap=sdl2 \
          --requirements=python3,kivy \
          --arch=arm64-v8a

    - name: Export and Save APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kivy-Android-APK
        path: ./*.apk
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          git zip unzip autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libssl-dev libgstreamer1.0-dev cmake gettext || \
        (sleep 5 && sudo apt-get install -y --no-install-recommends git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev libgstreamer1.0-dev cmake gettext)

        echo "Installing Android SDK and NDK components..."
        mkdir -p $HOME/Android/Sdk/cmdline-tools
        curl -o cmdline-tools.zip https://google.com
        mkdir -p tmp_cmdline
        unzip -q cmdline-tools.zip -d tmp_cmdline
        mv tmp_cmdline/cmdline-tools $HOME/Android/Sdk/cmdline-tools/latest
        rm -rf tmp_cmdline cmdline-tools.zip
        yes | $HOME/Android/Sdk/cmdline-tools/latest/bin/sdkmanager --licenses
        $HOME/Android/Sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;25.2.9519653"

        echo "Installing core python-for-android tools..."
        pip install --upgrade pip
        pip install cython python-for-android

        echo "Compiling final application binary..."
        export ANDROIDSDK="$HOME/Android/Sdk"
        export ANDROIDNDK="$HOME/Android/Sdk/ndk/25.2.9519653"
        export PATH="$ANDROIDSDK/platform-tools:$HOME/.local/bin:$PATH"
        p4a apk --sdk-dir="$ANDROIDSDK" --ndk-dir="$ANDROIDNDK" --android-api=33 --ndk-version=25.2.9519653 --private . --package=org.example.kivyapp --name="My Kivy App" --version=1.0 --bootstrap=sdl2 --requirements=python3,kivy --arch=arm64-v8a

    - name: Save Compiled APK File
      uses: actions/upload-artifact@v4
      with:
        name: Kivy-Android-APK
        path: ./*.apk
