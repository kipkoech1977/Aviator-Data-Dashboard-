name: Build Kivy APK without Buildozer

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Linux System Dependencies
      run: |
        sudo apt-get update --fix-missing || true
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          git zip unzip autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libssl-dev libgstreamer1.0-dev cmake gettext

    - name: Install Android SDK and NDK via Command Line Tools
      run: |
        mkdir -p $HOME/Android/Sdk/cmdline-tools
        curl -o cmdline-tools.zip https://google.com
        mkdir -p tmp_cmdline
        unzip -q cmdline-tools.zip -d tmp_cmdline
        mv tmp_cmdline/cmdline-tools $HOME/Android/Sdk/cmdline-tools/latest
        rm -rf tmp_cmdline cmdline-tools.zip
        
        # Accept licenses and fetch exact platform components
        yes | $HOME/Android/Sdk/cmdline-tools/latest/bin/sdkmanager --licenses
        $HOME/Android/Sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;25.2.9519653"

    - name: Install python-for-android and Compilation Prerequisites
      run: |
        pip install --upgrade pip
        pip install cython python-for-android

    - name: Compile APK via python-for-android
      run: |
        export ANDROIDSDK="$HOME/Android/Sdk"
        export ANDROIDNDK="$HOME/Android/Sdk/ndk/25.2.9519653"
        export PATH="$ANDROIDSDK/platform-tools:$HOME/.local/bin:$PATH"
        
        # Note: Replace '.' with your subfolder name if main.py is inside a subdirectory
        p4a apk \
          --sdk-dir="$ANDROIDSDK" \
          --ndk-dir="$ANDROIDNDK" \
          --android-api=33 \
          --ndk-version=25.2.9519653 \
          --private . \
          --package=org.example.kivyapp \
          --name="My Kivy App" \
          --version=1.0 \
          --bootstrap=sdl2 \
          --requirements=python3,kivy \
          --arch=arm64-v8a

    - name: Upload Compiled APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kivy-Android-APK
        path: ./*.apk
        curl -o cmdline-tools.zip https://google.com
        mkdir -p tmp_cmdline
        unzip -q cmdline-tools.zip -d tmp_cmdline
        mv tmp_cmdline/cmdline-tools $HOME/Android/Sdk/cmdline-tools/latest
        rm -rf tmp_cmdline cmdline-tools.zip
        
        # Accept licenses and fetch exact platform components
        yes | $HOME/Android/Sdk/cmdline-tools/latest/bin/sdkmanager --licenses
        $HOME/Android/Sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;25.2.9519653"

    - name: Install python-for-android and Compilation Prerequisites
      run: |
        pip install --upgrade pip
        pip install cython python-for-android

    - name: Compile APK via python-for-android
      run: |
        export ANDROIDSDK="$HOME/Android/Sdk"
        export ANDROIDNDK="$HOME/Android/Sdk/ndk/25.2.9519653"
        export PATH="$ANDROIDSDK/platform-tools:$HOME/.local/bin:$PATH"
        
        # Note: Replace '.' with your Kivy app directory path if your main.py is in a subfolder
        p4a apk \
          --sdk-dir="$ANDROIDSDK" \
          --ndk-dir="$ANDROIDNDK" \
          --android-api=33 \
          --ndk-version=25.2.9519653 \
          --private . \
          --package=org.example.kivyapp \
          --name="My Kivy App" \
          --version=1.0 \
          --bootstrap=sdl2 \
          --requirements=python3,kivy \
          --arch=arm64-v8a

    - name: Upload Compiled APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kivy-Android-APK
        path: ./*.apk
